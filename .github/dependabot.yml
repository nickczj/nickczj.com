version: 2

updates:
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    groups:
      javascript:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "cargo"
    directory: "/addons/homelab-status-agent"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    groups:
      rust:
        patterns: ["*"]

  - package-ecosystem: "docker"
    directory: "/addons/homelab-status-agent"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
